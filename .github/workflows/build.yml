name: Build Cineginsa Multi-Plateforme

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer les dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libva-dev imagemagick

      - name: Configurer le compilateur MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Installer Qt 6 et Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ runner.os == 'Windows' && '6.8.3' || '6.*' }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          modules: 'qtmultimedia qtshadertools'
          tools: ${{ runner.os != 'Windows' && 'tools_ninja' || '' }}

      - name: Configurer CMake (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compiler le projet
        run: cmake --build build --parallel

      # --- EMPAQUETAGE LINUX (AppImage) ---
      - name: Créer l'AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/Cineginsa AppDir/usr/bin/
          cat << 'DESKTOP' > AppDir/usr/share/applications/Cineginsa.desktop
          [Desktop Entry]
          Type=Application
          Name=Cineginsa
          Exec=Cineginsa
          Icon=cineginsa
          Categories=AudioVideo;Utility;
          DESKTOP
          convert assets/logo.png -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/cineginsa.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(which qmake)
          export QML_SOURCES_PATHS=.
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

      - name: Uploader l'AppImage Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-Linux-AppImage
          path: Cineginsa*.AppImage

      # --- EMPAQUETAGE WINDOWS (Archive ZIP autonome) ---
      - name: Rassembler les DLL Qt et compresser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy
          Copy-Item build\Cineginsa.exe deploy\
          magick assets\logo.png -define icon:auto-resize=256,128,64,48,32,16 deploy\cineginsa.ico
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile "rcedit.exe"
          .\rcedit.exe deploy\Cineginsa.exe --set-icon deploy\cineginsa.ico
          Remove-Item deploy\cineginsa.ico
          windeployqt --release --qmldir . deploy\Cineginsa.exe
          Compress-Archive -Path deploy\* -DestinationPath Cineginsa-Windows.zip

      - name: Uploader le paquet Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-Windows
          path: Cineginsa-Windows.zip

      # --- EMPAQUETAGE MACOS (.dmg) ---
      - name: Créer l'image disque .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p Cineginsa.iconset build/Cineginsa.app/Contents/Resources
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/logo.png --out Cineginsa.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double assets/logo.png --out Cineginsa.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns Cineginsa.iconset -o build/Cineginsa.app/Contents/Resources/cineginsa.icns
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string cineginsa.icns" build/Cineginsa.app/Contents/Info.plist || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile cineginsa.icns" build/Cineginsa.app/Contents/Info.plist
          macdeployqt build/Cineginsa.app -qmldir=.
          codesign --deep --force --sign - build/Cineginsa.app
          hdiutil create -volname "Cineginsa" -srcfolder build/Cineginsa.app -ov -format UDZO Cineginsa-macOS.dmg

      - name: Uploader le .dmg macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-macOS
          path: Cineginsa-macOS.dmg

  # --- PUBLICATION AUTOMATIQUE DANS GITHUB RELEASES ---
  release:
    name: Publier la Release GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Récupérer les 3 builds générés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer la Release et attacher les installeurs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
