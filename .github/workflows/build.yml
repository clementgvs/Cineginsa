name: Build Cineginsa Multi-Plateforme

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer les dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Installer Qt 6 et Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.*'
          modules: 'qtmultimedia qtshadertools'
          tools: 'tools_ninja'

      - name: Configurer CMake (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compiler le projet
        run: cmake --build build --parallel

      # --- EMPAQUETAGE LINUX (AppImage) ---
      - name: Créer l'AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/Cineginsa AppDir/usr/bin/
          cat << 'DESKTOP' > AppDir/usr/share/applications/Cineginsa.desktop
          [Desktop Entry]
          Type=Application
          Name=Cineginsa
          Exec=Cineginsa
          Icon=cineginsa
          Categories=AudioVideo;Utility;
          DESKTOP
          python3 -c "import zlib, struct; w=h=256; raw=b''.join(b'\x00'+b'\x00\x00\x00'*w for _ in range(h)); png=b'\x89PNG\r\n\x1a\n'+b''.join(struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff) for t,d in [(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0)),(b'IDAT',zlib.compress(raw)),(b'IEND',b'')]); open('AppDir/usr/share/icons/hicolor/256x256/apps/cineginsa.png','wb').write(png)"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QML_SOURCES_PATHS=.
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

      - name: Uploader l'AppImage Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-Linux-AppImage
          path: Cineginsa*.AppImage

      # --- EMPAQUETAGE WINDOWS (Dossier autonome / ZIP) ---
      - name: Rassembler les DLL Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir deploy
          copy build\Cineginsa.exe deploy\
          windeployqt --release --qmldir . deploy\Cineginsa.exe

      - name: Uploader le paquet Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-Windows
          path: deploy/

      # --- EMPAQUETAGE MACOS (.dmg) ---
      - name: Créer l'image disque .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Cineginsa.app -qmldir=.
          codesign --deep --force --sign - build/Cineginsa.app
          hdiutil create -volname "Cineginsa" -srcfolder build/Cineginsa.app -ov -format UDZO Cineginsa-macOS.dmg

      - name: Uploader le .dmg macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Cineginsa-macOS
          path: Cineginsa-macOS.dmg
