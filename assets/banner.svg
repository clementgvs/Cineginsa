<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Cineginsa - auto-régie pour club ciné" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#050710"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3C5" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#22D3C5" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="holes" x="0" y="0" width="44" height="40" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="24" height="20" rx="4" fill="#02030A"/>
    </pattern>
    <text id="title" x="290" y="172" font-size="88" font-weight="800">Cineginsa</text>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#warm)"/>
  <polygon points="1280,40 1280,280 760,280 980,40" fill="url(#beam)"/>

  <!-- pellicule -->
  <rect width="1280" height="40" fill="#0F1630"/>
  <rect width="1280" height="40" fill="url(#holes)"/>
  <rect y="40" width="1280" height="2" fill="#FF7A1A" opacity="0.7" filter="url(#glow)"/>
  <g transform="translate(0,280)">
    <rect width="1280" height="40" fill="#0F1630"/>
    <rect width="1280" height="40" fill="url(#holes)"/>
    <rect y="-2" width="1280" height="2" fill="#FF7A1A" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- icône clap néon -->
  <g transform="translate(110 98)" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="0" y="42" width="124" height="84" rx="10" stroke="#FF7A1A"/>
    <path d="M0,42 L26,0 H58 L32,42 M42,42 L68,0 H100 L74,42 M84,42 L110,0 H132 L124,42" stroke="#FF7A1A"/>
    <polygon points="50,66 50,104 84,85" stroke="#22D3C5" fill="#22D3C5" fill-opacity="0.25"/>
  </g>

  <!-- titre : halo orange + texte crème -->
  <use xlink:href="#title" fill="#FF7A1A" filter="url(#halo)"/>
  <use xlink:href="#title" fill="#FFF3E0"/>
  <text x="294" y="218" font-size="30" font-weight="600" fill="#22D3C5" filter="url(#glow)">Auto-régie pour club ciné</text>
  <text x="294" y="254" font-size="20" fill="#9AA6C7">Scènes · Compte à rebours · Snacks · Lecture du film</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
